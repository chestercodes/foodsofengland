A broth with raisins. Known from dialect glossaries. Possibly similar to <a href="fig-sue.html"><b>Fig-Sue</b></a>.<br>
<br>
'<i>The Pitman's Pay</i>', by Thomas Wilson (1843) includes;<br>
<blockquote><i>A dumplin' like a sma'-coal heap-<br>
A puil o' <span style="Background-Color: #FFFF84">spice-kyel</span> i' the middle-<br>
Wi' pies and puddin's, wide and deep,<br>
Aboot myed up the savoury siddell.</i></blockquote>
