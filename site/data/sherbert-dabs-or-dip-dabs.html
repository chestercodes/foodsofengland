Hard fruit candy lolly supplied with a small bag of sherbert. The lolly is licked and dipped in the sherbert.<br>
<br>
Not to be confused with Dabb Sherbert, an unusually exotic version of the original Persian Sherbert fruit drink, still occasionally encountered in India.<br>
