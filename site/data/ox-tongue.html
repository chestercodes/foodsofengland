Tongues can be simply boiled and sliced, but this is now rare. They are more commonly salted, boiled, skinned and pressed with beef jelly into a cylindrical slab to be cut and eaten cold. Historically (as '<a href="neat-s-tongues.html"><b>neat's tongue</b></a>') they were pickled, dried and smoked.<br>
