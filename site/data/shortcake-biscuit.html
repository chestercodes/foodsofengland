A sturdy biscuit of, typically, white wheat flour, sugar and fat in the ratio 2:1:1.<br>
<br>
When sold by name as 'shortcake', the biscuit is now customarily rectangular c21/2 x 11/4ins by 1/4in thick with a disctinctive 'rolled' style edge and pricked centre.<br>
