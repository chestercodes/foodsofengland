Unlike the dark, heavy cocoa-rich drinks known elsewhere, such as Italy's <i>cioccolata densa</i>, English Drinking Chocolate is a hot drink made by adding milk to a powder preparation containing relatively low-fat cocoa with sugar and, often, milk powder.<br>
