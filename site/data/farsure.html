Old term for forcemeat, usually highly flavoured with sweet spices.<br>
<br>
Occurs in '<i>The Forme of Cury</i>' by the Chief Master-Cook of King Richard II, c1390 (<a href="references.html#cury-1390"><b>Cury 1390</b></a>), in the verse cookery book '<i>Liber Cure Cocorum</i>', 1430 (<a href="references.html#liber-cure-1430"><b>Liber Cure 1430</b></a>) etc.
