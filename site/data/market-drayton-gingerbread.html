Semi-hard, slightly soda-raised biscuit slab, approximately 3ins by 4ins, scored and ridged to form 7 slim fingers. Flavoured with ginger, rum and lemon. Produced by Billingtons bakery, the product is extremely unusual in being <i>extruded</i> rather than pressed or moulded, giving a distinctive texture.<br>
