Known from '<i>A Dictionary of obsolete and provincial English</i>' by Thomas Wright (<a href="references.html#wright-1857"><b>Wright 1857</b></a>). as a long round pudding. See: <a href="blanket-pudding.html"><b>Blanket Pudding</b></a><br>
<br>
'Poke-Pudding', along with 'Bottle-Tit' and 'Caper-Tail' are also recorded as local names for the Long-Tailed Tit <i>Aegithalos caudatus</i>.
