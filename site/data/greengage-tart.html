Open tart with filling of sliced greengages with sugar (<a href="references.html#soyer-1845"><b>Soyer 1845</b></a>, etc).<br>
<br>
GE Farrow's '<i>The Wallypug of London</i>' (1898) has;<br>
<div style="margin-left: 2em">For thy dear sake all cakes I shun<br>
Smeared o’er with jam. No apricot<br>
Or greengage tart my heart hath won;<br>
Their sweetness doth but cloy and clot.</div>
