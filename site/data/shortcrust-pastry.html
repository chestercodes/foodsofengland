A crust of pastry made short with butter or other fat. Typically 8 oz plain flour to each 4 oz of butter or lard and enough milk to make a dough.<br>
<br>
Known at least since Hannah Glasse '<i>The Art of Cookery</i>' (1774); "Make a short Crust, roll it thick." (<a href="references.html#oed"><b>OED</b></a>)
