Hot beer with spices. Spirits such as rum sometimes added. Occasionally with egg. Known from the 17th to the 19th century (<a href="references.html#oed"><b>OED</b></a>) it is unrelated to the <a href="lancashire-hotpot.html"><b>stew</b></a> of the same name (<a href="references.html#wright-1857"><b>Wright 1857</b></a>, etc).<br>
<br>
A traditional accompaniment to <a href="kattern-cake.html"><b>Kattern Cakes</b></a>.
