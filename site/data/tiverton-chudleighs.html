Sweet butter-rich yeast-raised white bread formed into balls and baked. Served cold split in half and filled, eg. with <a href="clotted-cream.html"><b>clotted cream</b></a>.<br>
<br>
Essentially the same as <a href="splits.html"><b>Cornish Spits</b></a>, but not sugared. Known from local reports and <a href="references.html#bft"><b>British Food Trust</b></a><br>
