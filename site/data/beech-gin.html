Sweetened gin in which young beech leaves have been steeped for several weeks.<br>
<br>
Known from '<i>Food in England</i>' by Dorothy Hartley (<a href="references.html#hartley-1954"><b>Hartley 1954</b></a>). and local references. This has sometimes been referred to as a <i>Noyaux</i>, but that French liquer is usually made with nut <i>kernels</i>.
