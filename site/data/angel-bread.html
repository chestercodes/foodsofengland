Described in <a href="references.html#wright-1857"><b>Wright 1857</b></a> as "a purgative cake made of spurge, ginger, flour, oatmeal etc." Spurge is a plant of the <i>Euphorbia</i> family, which exudes a milky sap, long used as a laxative.<br>
