Large, rectangular pork, or pork and veal, with jelly, loaf-form tin-baked pie in hot water paste. Sliced and served cold.<br>
<br>
Differs from a <a href="gala-pie.html"><b>gala pie</b></a> in that Ascot Pie never has eggs and usually has a crisper, more highly glazed, pastry.<br>
