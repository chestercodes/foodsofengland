Round, thin, scones made with roughly half-and-half white wheatflour and mashed potato. A form of <a href="potato-cake.html"><b>Potato Cake</b></a>.<br>
<br>
The name is distinctly Scots, being known at least since the '<i>Stirling Observer</i>' of 7 February 1867, but permeates the border regions of Cumbria and Northumberland.
