English Galingale is <i>Cyperus longus</i> a herb with a highly aromatic root, similar in flavour to the East Indian Galingale, which are of the genera <i>Alpinia</i> and <i>Kæmpferia</i>. It was used to flavour many dishes and formed the basis of the pungent <a href="galandine-sauce.html"><b>galyntyne sauce</b></a> of medieval cookery.
