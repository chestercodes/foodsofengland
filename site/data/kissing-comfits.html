Old name for perfumed sugar sweets, to freshen the breath (<a href="references.html#murrell-1617"><b>Murrell 1617</b></a>, etc). May 1671 makes them as thin lozenges of sugar with musk, civet, ambergris and white orris set with <a href="food-additives.html"><b>gum dragon</b></a> (E413).<br>
<br>
Falstaff in Shakespeare's '<i>Merry Wives of Windsor</i>' says "Let the sky hail kissing comfits".
