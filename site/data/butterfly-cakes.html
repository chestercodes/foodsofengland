Small sponge cup-cakes with a disc cut from the domed top, split in half and re-attached with cream or fondant, each piece at an angle to the other, in broad imitation of a butterfly's wings.<br>
<br>
Known at least since '<i>The Big Book of Baking</i>', Paragon, Bath, c1977<br>
