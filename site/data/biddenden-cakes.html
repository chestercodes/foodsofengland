Hard cakes distributed annually as part of the 'Biddenden Dole'. Each cake bearing the image of two females, said to be the conjoined sisters Eliza and Mary Chulkhurst, who, in the 12th Century, left a gift of land, called the Bread and Cheese Lands, to provide aid to the poor.<br>
