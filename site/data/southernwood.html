<i>Artemisia abrotanum</i>, a bushy flowering herb also known as Boy's Love, Maid's Ruin, Sagebrush and Lemon Plant, with a strong camphor-like odour. It was reputed to have aphrodisiac properties and appears occasionally as a flavouring in medieval food.<br>
