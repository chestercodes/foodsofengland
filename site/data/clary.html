Clary, or English Clary, is <i>Silvia Sclarea</i>, also known as Clary Sage, Clear Eye and Eyebright, a herb with erect spikes of blue flowers. Both the seeds and leaves were used as flavourings in food and in beer. The plant is now very rare.<br>
