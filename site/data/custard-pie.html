Originally a 'custard' was a kind of open pie containing an egg-set confection, often with meat or fruit, such as the ancient <a href="crustard-of-flessh.html"><b>Crustard</b></a> or <a href="doucette.html"><b>Doucette</b></a>. The word derives from the pie casing, the 'crust', and only later did it get transferred to the egg-mixture.<br>
