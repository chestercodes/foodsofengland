Paste of cream, sugar, flour and orange water spread very thinly and baked crisp, in a manner similar to <a href="brandy-snaps.html"><b>Brandy Snaps</b></a>. Served as a decoration and accompaniment to sweet deserts. Widely known from local reports with one published receipt in <a href="references.html#j-salmon"><b>J.Salmon's</b></a> "<i>Favourite New Forest Recipes</i>"<br>
