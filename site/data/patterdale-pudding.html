Formerly a specialty of Mr. Brownrigg's Hotel at Patterdale. 'Mackenzie's Ten Thousand Receipts' of 1865 says it was "Made at a celebrated inn in England. Three eggs and their weight in sugar, flour, and butter. Bake in small pans and eat with sauce."<br>
