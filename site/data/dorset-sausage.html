A type of chilled meat loaf.<br>
<br>
Described by <a href="references.html#bft"><b>BFT</b></a>; "Dorset Sausage is a misnomer because it is really a meat loaf, made a day in advance and left to chill. It is ideal for slicing and taking on a picnic, served as a starter with toast or as a substantial supper dish with a salad."
