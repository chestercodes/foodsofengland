Known from <a href="references.html#j-salmon"><b>J.Salmon</b></a>'s '<i>Favourite Dorset Recipes</i>'. The name 'Wessex' for the ancient kingdoms encompassing Dorset, Somerset, Hampshire, and Wiltshire is known only since 1868 (<a href="references.html#oed"><b>OED</b></a>)
