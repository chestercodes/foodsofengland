The edible crab, <i>Cancer pagurus</i>, is sometimes referred to as Cromer Crab, as it is commonly caught around the Norfolk town of Cromer.<br>
<br>
Cromer and Sheringham hold a 'Crab and Lobster Festival' in May.<br>
