The small, oval, red fruits of a thorny shrub. Common in cooking before the late 19th Century, the European Barberry (<i>Berberis vulgaris</i>) is thought to host the wheat rust disease <i>Puccinia graminis</i>, so that its cultivation is now discouraged.<br>
