Ground Elder, <i>Aegopodium podagraria</i> (Goutweed, Herb Gerard, Bishop's Weed, Parson's Weed) is a low-growing perennial herb of the carrot family. The leaves are used as a flavouring or occasionally cooked as a green vegetable.<br>
