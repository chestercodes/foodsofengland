version: "2.4"
services:
  site:
    build:
      context: ..
      dockerfile: docker/site.Dockerfile
    expose:
      - "5000"
    environment:
      - ASPNETCORE_URLS=http://*:5000/
  tests:
    build:
      context: ..
      dockerfile: docker/end2end.Dockerfile
    environment:
      - BASE_URL=http://site:5000
    depends_on:
      - site
