name: Build and publish images
on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "*"
  schedule:
    - cron: "0 14 2 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: chestercodes
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=$(date +'v%y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Build inttests (native amd64)
        run: docker compose -f docker/inttests.yaml build

      - name: Run inttests
        run: docker compose -f docker/inttests.yaml up --exit-code-from tests --no-attach migrations

      - name: Build and push Site multi-arch
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/site.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/chestercodes/foodsofengland/site:${{ env.IMAGE_TAG }}
            ghcr.io/chestercodes/foodsofengland/site:latest
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      - name: Build and push End2End multi-arch
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/end2end.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/chestercodes/foodsofengland/end2end:${{ env.IMAGE_TAG }}
            ghcr.io/chestercodes/foodsofengland/end2end:latest
          cache-from: type=gha,scope=end2end
          cache-to: type=gha,mode=max,scope=end2end

      - name: Create git tag
        run: |
          git tag ${{ env.IMAGE_TAG }}
          git push origin ${{ env.IMAGE_TAG }}
